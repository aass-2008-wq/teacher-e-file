<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملف الإلكتروني للمعلم</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --blue:#1e3a8a;
    --blue2:#1e40af;
    --gold:#d4af37;
    --bg:#f3f4f6;
    --border:#e5e7eb;
  }

  body{
    font-family:'Tajawal',sans-serif;
    background:var(--bg);
    margin:0;
    padding:20px;
  }

  .container{
    max-width:1000px;
    margin:auto;
    background:#fff;
    padding:24px;
    border-radius:20px;
  }

  /* ===== Header ===== */
  header{
    display:grid;
    grid-template-columns:120px 1fr 120px;
    align-items:center;
    gap:10px;
    border-bottom:5px solid var(--blue);
    padding-bottom:16px;
    margin-bottom:24px;
  }

  header img{
    max-height:70px;
    width:auto;
    object-fit:contain;
  }

  header h1{
    text-align:center;
    margin:0;
    font-size:30px;
    color:var(--blue);
    font-weight:800;
  }

  /* ===== Info Box ===== */
  .info-box{
    margin-top:18px;
    background:linear-gradient(135deg,var(--blue),var(--blue2));
    color:#fff;
    border-radius:18px;
    padding:20px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:16px;
    text-align:center;
  }

  .info-item span{
    display:block;
    font-size:14px;
    color:#fde68a;
    margin-bottom:6px;
  }

  .info-item strong{
    font-size:22px;
    font-weight:800;
  }

  /* ===== Inputs ===== */
  .no-print label{font-weight:700}
  .no-print input{
    width:100%;
    padding:10px;
    margin:6px 0 14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-family:'Tajawal';
  }

  /* ===== Pages ===== */
  .page{
    margin-top:36px;
    page-break-after:always;
  }
  .page:last-child{page-break-after:auto}

  .page h2{
    color:var(--blue);
    border-bottom:3px solid var(--gold);
    padding-bottom:8px;
    margin-bottom:16px;
    font-size:22px;
  }

  .upload-box{
    border:2px dashed #cbd5e1;
    border-radius:16px;
    padding:18px;
    text-align:center;
    background:#f9fafb;
    cursor:pointer;
  }

  .upload-box input{display:none}

  .thumbs{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:14px;
    margin-top:18px;
  }

  .thumb{
    border:1px solid var(--border);
    border-radius:14px;
    padding:8px;
    background:#fff;
  }

  .thumb img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:10px;
  }

  .thumb-actions{
    display:flex;
    gap:6px;
    justify-content:center;
    margin-top:8px;
  }

  .mini{
    padding:6px 12px;
    font-size:12px;
    border-radius:10px;
    border:1px solid #c7d2fe;
    background:#eef2ff;
    color:#1e40af;
  }

  .danger{
    background:#fee2e2;
    color:#b91c1c;
    border-color:#fecaca;
  }

  /* ===== Buttons ===== */
  .buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:30px;
  }

  button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:16px;
    font-size:15px;
    font-family:'Tajawal';
    cursor:pointer;
  }

  .save{background:#16a34a;color:#fff}
  .clear{background:#dc2626;color:#fff}
  .print{background:#1e40af;color:#fff}

  footer{
    text-align:center;
    margin-top:34px;
    font-size:13px;
    color:#555;
  }

  /* ===== Print ===== */
  @media print{
    body{background:#fff;padding:0}
    .no-print, .buttons{display:none}
    .container{padding:0}
    header{margin-bottom:12mm}
    .page{margin:0}
  }
</style>
</head>

<body>
<div class="container">

  <!-- Header with fixed logos -->
  <header>
    <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663293570176/FybNzBQEoqkSKFnG.png" alt="شعار وزارة التعليم">
    <h1>الملف الإلكتروني للمعلم</h1>
    <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663293570176/AdvEaEhDMUJTLIgK.png" alt="شعار المدرسة">
  </header>

  <!-- Big info -->
  <div class="info-box">
    <div class="info-item">
      <span>اسم المعلم</span>
      <strong id="pTeacher">—</strong>
    </div>
    <div class="info-item">
      <span>اسم مدير المدرسة</span>
      <strong id="pPrincipal">—</strong>
    </div>
    <div class="info-item">
      <span>اسم المدرسة</span>
      <strong id="pSchool">—</strong>
    </div>
  </div>

  <!-- Inputs -->
  <div class="no-print">
    <label>اسم المعلم</label>
    <input id="teacher">

    <label>اسم مدير المدرسة</label>
    <input id="principal">

    <label>اسم المدرسة</label>
    <input id="school">
  </div>

  <!-- Sections -->
  <div class="page">
    <h2>الخطة الفصلية</h2>
    <label class="upload-box">
      اضغط لرفع صور الخطة الفصلية
      <input type="file" multiple accept="image/*" onchange="upload('term',this.files)">
    </label>
    <div id="thumbs_term" class="thumbs"></div>
  </div>

  <div class="page">
    <h2>الخطة الأسبوعية</h2>
    <label class="upload-box">
      اضغط لرفع صور الخطة الأسبوعية
      <input type="file" multiple accept="image/*" onchange="upload('week',this.files)">
    </label>
    <div id="thumbs_week" class="thumbs"></div>
  </div>

  <div class="page">
    <h2>سجلات المتابعة</h2>
    <label class="upload-box">
      اضغط لرفع صور سجلات المتابعة
      <input type="file" multiple accept="image/*" onchange="upload('records',this.files)">
    </label>
    <div id="thumbs_records" class="thumbs"></div>
  </div>

  <div class="page">
    <h2>الإعلانات</h2>
    <label class="upload-box">
      اضغط لرفع صور الإعلانات
      <input type="file" multiple accept="image/*" onchange="upload('ads',this.files)">
    </label>
    <div id="thumbs_ads" class="thumbs"></div>
  </div>

  <!-- Buttons -->
  <div class="buttons no-print">
    <button class="save" onclick="saveData()">حفظ البيانات</button>
    <button class="clear" onclick="clearData()">مسح البيانات</button>
    <button class="print" onclick="window.print()">طباعة / حفظ PDF</button>
  </div>

  <footer>
    برمجة وتنفيذ الأستاذ مقرن المطيري
  </footer>

</div>

<script>
const data={
  teacher:'',
  principal:'',
  school:'',
  images:{term:[],week:[],records:[],ads:[]}
};

function upload(type,files){
  [...files].forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      data.images[type].push(e.target.result);
      render(type);
    }
    r.readAsDataURL(f);
  });
}

function render(type){
  const box=document.getElementById('thumbs_'+type);
  box.innerHTML='';
  data.images[type].forEach((src,i)=>{
    box.innerHTML+=`
      <div class="thumb">
        <img src="${src}">
        <div class="thumb-actions no-print">
          <button class="mini" onclick="move('${type}',${i},-1)">⬆️</button>
          <button class="mini" onclick="move('${type}',${i},1)">⬇️</button>
          <button class="mini danger" onclick="del('${type}',${i})">حذف</button>
        </div>
      </div>`;
  });
}

function move(type,i,d){
  const a=data.images[type];
  const n=i+d;
  if(n<0||n>=a.length)return;
  [a[i],a[n]]=[a[n],a[i]];
  render(type);
}

function del(type,i){
  data.images[type].splice(i,1);
  render(type);
}

function saveData(){
  data.teacher=teacher.value;
  data.principal=principal.value;
  data.school=school.value;
  localStorage.setItem('teacherFile',JSON.stringify(data));
  alert('تم حفظ البيانات');
}

function clearData(){
  if(confirm('مسح جميع البيانات؟')){
    localStorage.removeItem('teacherFile');
    location.reload();
  }
}

(function load(){
  const d=JSON.parse(localStorage.getItem('teacherFile'));
  if(!d)return;
  Object.assign(data,d);
  teacher.value=data.teacher;
  principal.value=data.principal;
  school.value=data.school;
  ['term','week','records','ads'].forEach(render);
  updateHeader();
})();

function updateHeader(){
  pTeacher.textContent=teacher.value||'—';
  pPrincipal.textContent=principal.value||'—';
  pSchool.textContent=school.value||'—';
}

['teacher','principal','school'].forEach(id=>{
  document.getElementById(id).addEventListener('input',updateHeader);
});
</script>

</body>
</html>
