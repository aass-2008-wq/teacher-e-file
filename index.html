<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الملف الإلكتروني للمعلم</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --blue:#0b2d5c;
    --blue2:#123b78;
    --gold:#d6b25e;
    --border:#e5e7eb;
    --muted:#6b7280;
    --bg:#f3f4f6;
  }

  *{box-sizing:border-box}
  body{font-family:'Tajawal',sans-serif;background:var(--bg);margin:0;padding:18px}

  /* ====== واجهة الموقع ====== */
  .app{
    max-width:1100px;
    margin:auto;
    background:#fff;
    border-radius:18px;
    padding:18px;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 14px 18px;
    border-bottom:3px solid var(--blue);
  }

  .topbar img{
    height:62px;
    width:auto;
    object-fit:contain;
    background:#fff;
    border-radius:12px;
    padding:6px;
    border:1px solid var(--border)
  }

  .title{
    text-align:center;
    flex:1;
  }

  .title h1{
    margin:0;
    font-size:26px;
    color:var(--blue);
    font-weight:800
  }

  .title p{
    margin:6px 0 0;
    color:var(--muted);
    font-size:13px
  }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    margin-top:16px;
  }

  @media(min-width:900px){
    .grid{grid-template-columns:360px 1fr}
  }

  .card{
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    background:#fff;
  }

  .card h2{
    margin:0 0 12px;
    color:var(--blue);
    font-size:16px
  }

  label{font-weight:800;font-size:13px}

  input[type="text"]{
    width:100%;
    padding:10px;
    margin:6px 0 12px;
    border:1px solid #cfcfcf;
    border-radius:12px;
    font-family:'Tajawal';
  }

  .btns{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:8px
  }

  button{
    border:none;
    border-radius:14px;
    padding:12px 14px;
    font-family:'Tajawal';
    cursor:pointer;
    font-size:14px
  }

  .b-save{background:#16a34a;color:#fff}
  .b-clear{background:#dc2626;color:#fff}
  .b-print{background:#1e40af;color:#fff;flex:1}

  .note{
    font-size:12px;
    color:var(--muted);
    margin-top:8px
  }

  .section{
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    background:#fff;
    margin-bottom:14px;
  }

  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-bottom:2px solid var(--gold);
    padding-bottom:10px;
    margin-bottom:12px;
  }

  .section-head h3{
    margin:0;
    color:var(--blue);
    font-size:18px
  }

  .section-head span{
    font-size:12px;
    color:var(--muted)
  }

  .upload{
    border:2px dashed #cbd5e1;
    border-radius:14px;
    padding:14px;
    background:#f9fafb;
    text-align:center;
  }

  .upload input{display:none}

  .upload label{
    display:block;
    cursor:pointer;
    font-weight:700;
    color:#334155
  }

  .upload small{
    display:block;
    margin-top:6px;
    color:var(--muted);
    font-weight:400
  }

  .thumbs{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:12px;
    margin-top:12px;
  }

  .thumb{
    border:1px solid var(--border);
    border-radius:14px;
    padding:8px;
    background:#fff;
  }

  .thumb img{
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:10px
  }

  .actions{
    display:flex;
    gap:6px;
    justify-content:center;
    margin-top:8px;
    flex-wrap:wrap
  }

  .mini{
    padding:6px 10px;
    border-radius:12px;
    font-size:12px;
    background:#eef2ff;
    border:1px solid #c7d2fe;
    color:#1e40af
  }

  .danger{
    background:#fee2e2;
    border-color:#fecaca;
    color:#b91c1c
  }

  .footer{
    text-align:center;
    margin-top:16px;
    color:#6b7280;
    font-size:12px;
  }

  /* ====== الطباعة ====== */
  #printArea{display:none}

  @media print{
    body{background:#fff;padding:0}
    .app{display:none !important}
    #printArea{display:block !important}
  }

  .p-page{
    width:210mm;
    min-height:297mm;
    padding:14mm;
    margin:0 auto;
    background:#fff;
    position:relative;
    page-break-after:always;
  }

  .p-page:last-child{page-break-after:auto}

  .p-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding-bottom:10mm;
    border-bottom:2px solid var(--blue);
  }

  .p-header img{
    height:22mm;
    width:auto;
    object-fit:contain
  }

  .p-header .p-title{
    text-align:center;
    flex:1
  }

  .p-header .p-title h1{
    margin:0;
    font-size:22px;
    color:var(--blue);
    font-weight:800
  }

  .p-header .p-title p{
    margin:6px 0 0;
    font-size:12px;
    color:#475569
  }

  .p-section-title{
    margin-top:12mm;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom:2px solid var(--gold);
    padding-bottom:4mm;
  }

  .p-section-title h2{
    margin:0;
    color:var(--blue);
    font-size:18px;
    font-weight:800
  }

  .p-image-box{
    margin-top:10mm;
    height:235mm;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:6mm;
  }

  .p-image-box img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
  }
</style>
</head>

<body>

<!-- واجهة الموقع -->
<div class="app">

  <div class="topbar">
    <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663293570176/FybNzBQEoqkSKFnG.png">
    <div class="title">
      <h1>الملف الإلكتروني للمعلم</h1>
      <p>تنظيم ورفع صور الخطط والسجلات ثم حفظها PDF</p>
    </div>
    <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663293570176/AdvEaEhDMUJTLIgK.png">
  </div>

  <div class="grid">
    <div class="card">
      <h2>بيانات الملف</h2>

      <label>اسم المعلم</label>
      <input id="teacher">

      <label>اسم مدير المدرسة</label>
      <input id="principal">

      <label>اسم المدرسة</label>
      <input id="school">

      <div class="btns">
        <button class="b-save" onclick="saveData()">حفظ البيانات</button>
        <button class="b-clear" onclick="clearData()">مسح البيانات</button>
        <button class="b-print" onclick="preparePrint()">طباعة / حفظ PDF</button>
      </div>

      <div class="note">البيانات محفوظة على جهازك فقط.</div>
    </div>

    <div>
      <!-- الأقسام -->
      <div class="section">
        <div class="section-head"><h3>الخطة الفصلية</h3><span>ترتيب ⬆️⬇️</span></div>
        <div class="upload">
          <label for="f_term">رفع صور الخطة الفصلية</label>
          <input id="f_term" type="file" multiple accept="image/*">
        </div>
        <div id="thumbs_term" class="thumbs"></div>
      </div>

      <div class="section">
        <div class="section-head"><h3>الخطة الأسبوعية</h3><span>ترتيب ⬆️⬇️</span></div>
        <div class="upload">
          <label for="f_week">رفع صور الخطة الأسبوعية</label>
          <input id="f_week" type="file" multiple accept="image/*">
        </div>
        <div id="thumbs_week" class="thumbs"></div>
      </div>

      <div class="section">
        <div class="section-head"><h3>سجلات المتابعة</h3><span>ترتيب ⬆️⬇️</span></div>
        <div class="upload">
          <label for="f_records">رفع صور سجلات المتابعة</label>
          <input id="f_records" type="file" multiple accept="image/*">
        </div>
        <div id="thumbs_records" class="thumbs"></div>
      </div>

      <div class="section">
        <div class="section-head"><h3>الإعلانات</h3><span>ترتيب ⬆️⬇️</span></div>
        <div class="upload">
          <label for="f_ads">رفع صور الإعلانات</label>
          <input id="f_ads" type="file" multiple accept="image/*">
        </div>
        <div id="thumbs_ads" class="thumbs"></div>
      </div>

      <!-- التوقيع (واجهة فقط) -->
      <div class="footer">برمجة وتنفيذ الأستاذ مقرن المطيري</div>
    </div>
  </div>
</div>

<!-- منطقة الطباعة -->
<div id="printArea"></div>

<script>
  const STORAGE_KEY = "teacher_e_file_final";

  const state = {
    info:{teacher:"",principal:"",school:""},
    sections:{term:[],week:[],records:[],ads:[]}
  };

  function fileToDataURL(file){
    return new Promise(res=>{
      const r=new FileReader();
      r.onload=()=>res(r.result);
      r.readAsDataURL(file);
    });
  }

  async function handleUpload(key,files){
    for(const f of [...files]){
      const src = await fileToDataURL(f);
      state.sections[key].push(src);
    }
    renderThumbs(key);
  }

  function renderThumbs(key){
    const box=document.getElementById("thumbs_"+key);
    box.innerHTML="";
    state.sections[key].forEach((src,i)=>{
      box.innerHTML+=`
        <div class="thumb">
          <img src="${src}">
          <div class="actions">
            <button class="mini" onclick="moveImg('${key}',${i},-1)">⬆️</button>
            <button class="mini" onclick="moveImg('${key}',${i},1)">⬇️</button>
            <button class="mini danger" onclick="delImg('${key}',${i})">حذف</button>
          </div>
        </div>`;
    });
  }

  function moveImg(key,i,d){
    const a=state.sections[key];
    const n=i+d;
    if(n<0||n>=a.length)return;
    [a[i],a[n]]=[a[n],a[i]];
    renderThumbs(key);
  }

  function delImg(key,i){
    state.sections[key].splice(i,1);
    renderThumbs(key);
  }

  function saveData(){
    state.info.teacher=teacher.value;
    state.info.principal=principal.value;
    state.info.school=school.value;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
    alert("تم الحفظ");
  }

  function clearData(){
    if(confirm("مسح جميع البيانات؟")){
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  }

  function loadData(){
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return;
    const d=JSON.parse(raw);
    Object.assign(state,d);
    teacher.value=state.info.teacher;
    principal.value=state.info.principal;
    school.value=state.info.school;
    ["term","week","records","ads"].forEach(renderThumbs);
  }

  function preparePrint(){
    state.info.teacher=teacher.value;
    state.info.principal=principal.value;
    state.info.school=school.value;

    const moe="https://files.manuscdn.com/user_upload_by_module/session_file/310519663293570176/FybNzBQEoqkSKFnG.png";
    const sch="https://files.manuscdn.com/user_upload_by_module/session_file/310519663293570176/AdvEaEhDMUJTLIgK.png";

    const print=document.getElementById("printArea");
    print.innerHTML="";

    const order=[
      {k:"term",t:"الخطة الفصلية"},
      {k:"week",t:"الخطة الأسبوعية"},
      {k:"records",t:"سجلات المتابعة"},
      {k:"ads",t:"الإعلانات"}
    ];

    for(const sec of order){
      for(const img of state.sections[sec.k]){
        const p=document.createElement("div");
        p.className="p-page";
        p.innerHTML=`
          <div class="p-header">
            <img src="${moe}">
            <div class="p-title">
              <h1>الملف الإلكتروني للمعلم</h1>
              <p>${state.info.school||""}</p>
            </div>
            <img src="${sch}">
          </div>

          <div class="p-section-title">
            <h2>${sec.t}</h2>
            <div></div>
          </div>

          <div class="p-image-box">
            <img src="${img}">
          </div>
        `;
        print.appendChild(p);
      }
    }

    setTimeout(()=>window.print(),200);
  }

  document.getElementById("f_term").onchange=e=>handleUpload("term",e.target.files);
  document.getElementById("f_week").onchange=e=>handleUpload("week",e.target.files);
  document.getElementById("f_records").onchange=e=>handleUpload("records",e.target.files);
  document.getElementById("f_ads").onchange=e=>handleUpload("ads",e.target.files);

  loadData();
</script>

</body>
</html>
